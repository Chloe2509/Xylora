<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xylora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050608;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 50px 24px;
    }

    .profile {
      text-align: center;
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #ddd;
      color: #777;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 18px;
    }

    h1 {
      font-size: 46px;
      margin: 0 0 8px;
    }

    .handle {
      color: #aaa;
      font-size: 20px;
      margin-bottom: 24px;
    }

    .tags {
      color: #ddd;
      font-size: 18px;
      margin-bottom: 36px;
    }

    .links {
      display: grid;
      gap: 16px;
      margin-bottom: 30px;
    }

    .link-btn {
      display: block;
      width: 100%;
      padding: 20px;
      border: 1px solid #2b2f3a;
      border-radius: 16px;
      background: #151820;
      color: white;
      text-decoration: none;
      font-size: 20px;
      transition: 0.2s;
    }

    .link-btn:hover {
      background: #20232d;
      transform: translateY(-2px);
    }

    .card {
      background: #151820;
      border: 1px solid #2b2f3a;
      border-radius: 16px;
      padding: 24px;
      margin: 16px 0;
    }

    .card h2 {
      margin-top: 0;
    }

    .card p {
      color: #aaa;
    }

    .account input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 10px;
      border: 1px solid #343846;
      background: #0d0f14;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px 16px;
      margin: 7px 5px 0 0;
      border: 0;
      border-radius: 10px;
      background: #7c5cff;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      opacity: 0.85;
    }

    button.secondary {
      background: #303442;
    }

    #authMessage {
      min-height: 24px;
      color: #bfc5ff;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      .container {
        padding: 30px 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- PROFILE -->
    <section class="profile">

      <div class="avatar">
        120 × 120
      </div>

      <h1>Chloe</h1>

      <div class="handle">
        @Chloe09
      </div>

      <div class="tags">
        Creator • Music • Communities • Projects
      </div>

    </section>


    <!-- LINKS -->
    <div class="links">

      <a class="link-btn" href="#" onclick="return false;">
        YouTube
      </a>

      <a class="link-btn" href="#" onclick="return false;">
        Discord
      </a>

      <a class="link-btn" href="#" onclick="return false;">
        Instagram
      </a>

    </div>


    <!-- MUSIC -->
    <section class="card">

      <h2>🎵 Music</h2>

      <p>
        My latest music
      </p>

    </section>


    <!-- WORK -->
    <section class="card">

      <h2>💼 Work</h2>

      <p>
        Projects and things I'm working on.
      </p>

    </section>


    <!-- COMMUNITIES -->
    <section class="card">

      <h2>👥 Communities</h2>

      <p>
        My communities
      </p>

    </section>


    <!-- ACCOUNT -->
    <section class="card account">

      <h2>Account</h2>

      <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <div>

        <button onclick="signUp()">
          Sign Up
        </button>

        <button onclick="signIn()">
          Log In
        </button>

        <button class="secondary" onclick="signOut()">
          Log Out
        </button>

      </div>

      <p id="authMessage"></p>

    </section>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://jejwsdvololiabbatfj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_lIsXchSu46GbMWCrqR8Y-g_Zu-BICr2";


    /*
      IMPORTANT:

      This is intentionally called supabaseClient
      instead of supabase.

      That prevents the error we were getting before.
    */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    function setMessage(message, isError = false) {

      const messageElement =
        document.getElementById("authMessage");

      messageElement.textContent = message;

      if (isError) {
        messageElement.style.color = "#ff8a8a";
      } else {
        messageElement.style.color = "#bfc5ff";
      }

    }


    async function signUp() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        setMessage(
          "Enter an email and password.",
          true
        );

        return;
      }


      if (password.length < 6) {

        setMessage(
          "Password must be at least 6 characters.",
          true
        );

        return;
      }


      setMessage("Creating your account...");


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,
          password: password

        });


      if (error) {

        setMessage(
          error.message,
          true
        );

        return;
      }


      if (data.session) {

        setMessage(
          "Account created and you're logged in!"
        );

      } else {

        setMessage(
          "Account created! Check your email to confirm your account."
        );

      }

    }


    async function signIn() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        setMessage(
          "Enter your email and password.",
          true
        );

        return;
      }


      setMessage("Logging in...");


      const { error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,
          password: password

        });


      if (error) {

        setMessage(
          error.message,
          true
        );

        return;
      }


      setMessage("You're logged in!");

    }


    async function signOut() {

      const { error } =
        await supabaseClient.auth.signOut();


      if (error) {

        setMessage(
          error.message,
          true
        );

        return;
      }


      setMessage("You are logged out.");

    }


    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        if (session) {

          setMessage(
            "You are logged in."
          );

        }

      }
    );

  </script>

</body>
</html>
